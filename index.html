<!doctype html>
<html lang="en" style="background-color: #0B2822;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="theme-color" content="#0B2822" />
    <meta name="background-color" content="#0B2822" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>GreenGold OS | Smart Waste Management</title>
    <meta name="title" content="GreenGold OS | Smart Waste Management" />
    <meta name="description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GreenGold OS | Smart Waste Management" />
    <meta property="og:description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="GreenGold OS | Smart Waste Management" />
    <meta property="twitter:description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />
    <meta property="twitter:image" content="/logo.png" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0B2822 !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #0B2822 !important;
      }
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B2822 !important;
        z-index: 999999;
      }
      .loader-logo {
        width: 110px;
        height: 110px;
        object-fit: contain;
        mix-blend-mode: screen;
        border-radius: 20px;
        animation: pulse-glow 1.8s ease-in-out infinite alternate;
      }
      .loader-text {
        color: #34D399;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.15em;
        margin-top: 20px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
      }
      .loader-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(52, 211, 153, 0.15);
        border-top-color: #34D399;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-top: 20px;
      }
      @keyframes pulse-glow {
        0% { transform: scale(0.94); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.4)); }
        100% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 25px rgba(52, 211, 153, 0.9)); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <img src="/logo.png" alt="GreenGold OS" class="loader-logo" />
        <div class="loader-text">GreenGold OS</div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
