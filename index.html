<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="background-color" content="#FFFFFF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>GreenGold OS | Smart Waste Management</title>
    <meta name="title" content="GreenGold OS | Smart Waste Management" />
    <meta name="description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #FFFFFF !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        overflow-y: auto !important;
      }
      #root {
        width: 100%;
        min-height: 100%;
        background-color: #FFFFFF !important;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FFFFFF !important;
        z-index: 999999;
      }
      .loader-logo-img {
        width: 150px;
        height: 150px;
        object-fit: contain;
        border-radius: 24px;
        animation: pulse-glow 1.8s ease-in-out infinite alternate;
      }
      .loader-text {
        color: #064E3B;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.12em;
        margin-top: 20px;
        text-transform: uppercase;
      }
      .loader-subtext {
        color: #059669;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-top: 4px;
        text-transform: uppercase;
      }
      .loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10B981;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-top: 24px;
      }
      @keyframes pulse-glow {
        0% { transform: scale(0.95); opacity: 0.9; filter: drop-shadow(0 4px 16px rgba(16, 185, 129, 0.2)); }
        100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 10px 30px rgba(16, 185, 129, 0.5)); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <img src="/logo.png" alt="GreenGold OS" class="loader-logo-img" />
        <div class="loader-text">GreenGold OS</div>
        <div class="loader-subtext">Smart Waste Management Platform</div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
