<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="theme-color" content="#0B2822" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>GreenGold OS | Smart Waste Management</title>
    <meta name="title" content="GreenGold OS | Smart Waste Management" />
    <meta name="description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #FFFFFF !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #FFFFFF !important;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FFFFFF !important;
        z-index: 999999;
      }
      .loader-logo-wrapper {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
        animation: pulse-glow 1.8s ease-in-out infinite alternate;
      }
      .loader-logo-svg {
        width: 72px;
        height: 72px;
      }
      .loader-text {
        color: #064E3B;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.12em;
        margin-top: 20px;
        text-transform: uppercase;
      }
      .loader-subtext {
        color: #059669;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-top: 4px;
        text-transform: uppercase;
      }
      .loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10B981;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-top: 20px;
      }
      @keyframes pulse-glow {
        0% { transform: scale(0.95); opacity: 0.85; filter: drop-shadow(0 4px 12px rgba(16, 185, 129, 0.2)); }
        100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 8px 24px rgba(16, 185, 129, 0.45)); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="loader-logo-wrapper">
          <svg class="loader-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Emerald Leaf -->
            <path d="M18 46C18 46 14 34 22 22C30 10 44 8 44 8C44 8 42 22 34 34C26 46 18 46 18 46Z" fill="url(#leaf-grad)" />
            <path d="M22 22C28 26 34 32 34 34" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" />
            <!-- Gold Smart Bin -->
            <rect x="30" y="26" width="22" height="28" rx="4" fill="url(#bin-grad)" stroke="#D97706" stroke-width="2" />
            <path d="M28 22H54L51 26H31L28 22Z" fill="#F59E0B" />
            <path d="M37 20H45" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
            <!-- Recycling Arrow Inside Bin -->
            <path d="M41 34L44 38H38L41 34Z" fill="#FFFFFF" />
            <path d="M37 42L40 46H34L37 42Z" fill="#FFFFFF" />
            <path d="M45 42L48 46H42L45 42Z" fill="#FFFFFF" />
            <defs>
              <linearGradient id="leaf-grad" x1="18" y1="8" x2="44" y2="46" gradientUnits="userSpaceOnUse">
                <stop stop-color="#34D399" />
                <stop offset="1" stop-color="#059669" />
              </linearGradient>
              <linearGradient id="bin-grad" x1="30" y1="22" x2="52" y2="54" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FBBF24" />
                <stop offset="1" stop-color="#D97706" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="loader-text">GreenGold OS</div>
        <div class="loader-subtext">Smart Waste Management</div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
