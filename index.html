<!doctype html>
<html lang="en" style="background-color: #0B2822;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="theme-color" content="#0B2822" />
    <meta name="background-color" content="#0B2822" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>GreenGold OS | Smart Waste Management</title>
    <meta name="title" content="GreenGold OS | Smart Waste Management" />
    <meta name="description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GreenGold OS | Smart Waste Management" />
    <meta property="og:description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="GreenGold OS | Smart Waste Management" />
    <meta property="twitter:description" content="GreenGold OS is a comprehensive platform empowering cities and businesses to efficiently manage organic waste and track carbon offsets." />
    <meta property="twitter:image" content="/logo.png" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0B2822;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B2822;
        z-index: 999999;
      }
      .loader-logo {
        width: 80px;
        height: 80px;
        animation: pulse-glow 1.5s ease-in-out infinite alternate;
      }
      .loader-text {
        color: #34D399;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin-top: 16px;
        text-transform: uppercase;
      }
      .loader-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(52, 211, 153, 0.2);
        border-top-color: #34D399;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 16px;
      }
      @keyframes pulse-glow {
        0% { transform: scale(0.95); opacity: 0.8; filter: drop-shadow(0 0 5px rgba(52, 211, 153, 0.3)); }
        100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.8)); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <img src="/logo.png" alt="GreenGold OS" class="loader-logo" />
        <div class="loader-text">GreenGold OS</div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
